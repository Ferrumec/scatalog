[package]
name = "scatalog"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
actixutils = "0.6.6"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls"] }
tracing = "0.1.44"
typed-eventbus = "0.2.1"
uuid = "1.26.0"
viewset = "0.4.0"
